<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi sitio web</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Mi sitio web</h1>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Servicios</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contenedor-tarjetas">
            <article class="tarjeta">
                <h2>Servicio 1</h2>
                <p>Descripción del servicio 1.</p>
            </article>

            <article class="tarjeta">
                <h2>Servicio 2</h2>
                <p>Descripción del servicio 2.</p>
            </article>

            <article class="tarjeta">
                <h2>Servicio 3</h2>
                <p>Descripción del servicio 3.</p>
            </article>
        </section>

        <section class="galeria">
            <img src="../img/Messi.jpg" alt="Fotografía de Lionel Messi">
            <img src="../img/Messi.jpg" alt="Segunda imagen de Lionel Messi">
            <img src="../img/Messi.jpg" alt="Tercera imagen de Lionel Messi">
        </section>

        <section>
            <h2>Contáctanos</h2>
            <form>
                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" name="nombre"><br><br>

                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="mensaje" rows="4" cols="50"></textarea><br><br>

                <input type="submit" value="Enviar">
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mi sitio web. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
